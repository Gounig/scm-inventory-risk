<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>백카톤 SQL 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 왼쪽 단계 목록 + 오른쪽 설명·SQL 편집기·결과표. 좁은 화면에서는 위아래로 쌓임 */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --ink:#1d2321; --muted:#5d6764; --line:#dfe3e0;
  --accent:#1f6f5c; --accent-soft:#e2efe9; --code-bg:#f0f2ef; --warn:#a2561a; --warn-soft:#f8ecdf;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1b211f; --ink:#e4e9e6; --muted:#9aa5a1; --line:#2c3532;
  --accent:#5fbf9f; --accent-soft:#1e3a31; --code-bg:#111614; --warn:#e3a067; --warn-soft:#3a2a1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b211f; --ink:#e4e9e6; --muted:#9aa5a1; --line:#2c3532;
  --accent:#5fbf9f; --accent-soft:#1e3a31; --code-bg:#111614; --warn:#e3a067; --warn-soft:#3a2a1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:20px}
header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.01em}
header p{margin:0;color:var(--muted);font-size:13px}
.status{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status.ok{color:var(--accent)}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:760px){nav{position:static;flex-direction:row;flex-wrap:wrap}}
.step-group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 2px;font-weight:600}
@media (max-width:760px){.step-group{width:100%}}
nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:baseline}
nav button .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent);color:#fff}
nav button[aria-current="true"] .k{color:#ffffffcc}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.lesson h2{margin:0 0 8px;font-size:19px;text-wrap:balance}
.lesson p,.lesson li{max-width:68ch}
.lesson p{margin:8px 0}
.lesson code{font-family:var(--mono);font-size:13px;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.note{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:10px 14px;border-radius:6px;font-size:14px;margin-top:12px}
.note b{color:var(--warn)}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.editor-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.editor-bar span{font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{display:block;width:100%;min-height:170px;resize:vertical;border:0;padding:14px 16px;background:var(--code-bg);color:var(--ink);font-family:var(--mono);font-size:13.5px;line-height:1.55;tab-size:2}
textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.result{border-top:1px solid var(--line)}
.meta{padding:8px 14px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.meta.err{color:var(--warn)}
.table-wrap{overflow:auto;max-height:420px}
table{border-collapse:collapse;font-size:13px;width:max-content;min-width:100%}
th,td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--panel);font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:600}
td.num{text-align:right}
td.null{color:var(--muted);font-style:italic}
tr:hover td{background:var(--accent-soft)}
.mapping{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;font-size:13px;margin:10px 0}
.mapping div{display:flex;gap:8px;align-items:baseline}
.mapping b{font-weight:500;min-width:70px}
.mapping code{font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

const SCHEMA_SQL = "-- =========================================================\n-- 01_schema.sql\n-- ERP 엑셀(발주현황 / 입고현황 / 재고현황)을 그대로 담는 원본 테이블\n-- ※ 공개 저장소의 데이터는 모두 가상(synthetic) 데이터\n-- =========================================================\n\nDROP TABLE IF EXISTS raw_order_lines;\nDROP TABLE IF EXISTS raw_inventory;\nDROP TABLE IF EXISTS raw_shipments;\n\n-- 발주현황 · 입고현황 엑셀은 열 구조가 같아서 한 테이블에 담고\n-- extract_type 으로 구분한다.\n--   extract_type = '발주' : 해당 월에 발주한 줄 (입고 전이면 rcv_* 비어 있음)\n--   extract_type = '입고' : 해당 월에 입고된 줄\nCREATE TABLE raw_order_lines (\n    extract_type  TEXT NOT NULL,   -- '발주' / '입고'\n    extract_month TEXT NOT NULL,   -- 'YYYY-MM' (파일명 기준)\n    maker_group   TEXT,            -- 삼사 (H/K/D/G)\n    part_no       TEXT,            -- Part No (원본 그대로, 숫자·문자 혼재)\n    brand         TEXT,\n    description   TEXT,\n    pi_no         TEXT,            -- 선적 P/I No  예) S-ABCD01-02-24\n    supplier      TEXT,            -- 국내 거래처\n    unit          TEXT,\n    cls           TEXT,\n    order_qty     REAL,            -- P/I 수량\n    po_qty        REAL,            -- 발주 수량\n    currency      TEXT,\n    po_price      REAL,\n    rcv_qty       REAL,            -- 입고 수량\n    return_qty    REAL,\n    rcv_price     REAL,\n    rcv_amount    REAL,\n    rcv_no        TEXT,\n    rcv_date      TEXT,            -- YYYY-MM-DD\n    prev_pi       TEXT,            -- 이전PI  (…BC = 백카톤 이월, …BO = 백오더)\n    orig_pi       TEXT,            -- 원PI    예) S-ABCD01-240313\n    po_date       TEXT             -- 발주일자\n);\n\n-- 재고현황\nCREATE TABLE raw_inventory (\n    maker_group   TEXT,\n    part_no       TEXT,            -- 대표품번\n    description   TEXT,\n    brand         TEXT,\n    stock_qty     REAL,            -- 재고\n    allocated_qty REAL,            -- 발주 (오더에 이미 묶인 수량)\n    free_qty      REAL,            -- 잔여 (= 재고 - 발주, 새 오더에 쓸 수 있는 수량)\n    std_price     REAL,            -- 표준단가\n    stock_price   REAL,            -- 재고단가\n    category_code TEXT,            -- 구분\n    group_partno  TEXT\n);\n\n-- 선적 실적 (P/I 단위)\n--   ship_date : 실제로 배가 떠난 날\n--   못 실은 물건은 다음 선적 P/I로 넘어가고(BC), 이번 P/I 금액은 실제 선적분으로 정리됨\n--   → 그래서 ship_rate 는 대부분 100%\nCREATE TABLE raw_shipments (\n    ship_date      TEXT,            -- 선적일자\n    order_date     TEXT,            -- 수주일자\n    buyer_name     TEXT,\n    pi_no          TEXT,\n    payment_terms  TEXT,            -- 결재 (T/T, D/A, L/C …)\n    order_amount   REAL,            -- 수주금액 (USD)\n    shipped_amount REAL,            -- 총선적액\n    ship_rate      REAL,            -- 선적율 (%)\n    cbm            REAL,\n    order_to_ship_days INTEGER      -- 기간: 수주 → 선적 일수\n);\n";
const CLEAN_SQL = "-- =========================================================\n-- 02_clean.sql\n-- 원본 테이블을 분석하기 좋은 형태로 정리하는 뷰(View)\n-- =========================================================\n\n-- ---------------------------------------------------------\n-- 1) 품번 매칭 키\n--    엑셀이 숫자로 읽으면서 앞자리 0이 사라지거나('01957' → '1957'),\n--    하이픈·공백 표기가 달라 같은 품번이 다른 값으로 저장되는 문제를 막기 위해\n--    \"대문자 + 하이픈/공백 제거 + 앞자리 0 제거\" 한 값을 매칭 키로 쓴다.\n-- ---------------------------------------------------------\nDROP VIEW IF EXISTS order_lines;\nCREATE VIEW order_lines AS\nSELECT\n    extract_type,\n    extract_month,\n    part_no,\n    LTRIM(UPPER(REPLACE(REPLACE(TRIM(part_no), '-', ''), ' ', '')), '0') AS part_key,\n    brand,\n    description,\n    supplier,\n    pi_no,\n    prev_pi,\n    orig_pi,\n\n    -- 2) 바이어 코드: 선적PI 'S-ABCD01-02-24' 의 앞 두 덩어리 'S-ABCD01'\n    CASE\n        WHEN pi_no LIKE '계획발주%' THEN 'PLAN'\n        WHEN INSTR(SUBSTR(pi_no, 3), '-') > 0\n            THEN SUBSTR(pi_no, 1, INSTR(SUBSTR(pi_no, 3), '-') + 1)\n        ELSE pi_no\n    END AS buyer_code,\n\n    -- 3) 줄 유형\n    --    BC_CARRY  : 이전 선적에 못 실려 이번 선적으로 넘어온 백카톤\n    --    BACKORDER : 백오더\n    --    PLAN      : 계획발주 (재고용 구매)\n    --    NEW       : 이번 오더를 위한 신규 발주\n    CASE\n        WHEN pi_no LIKE '계획발주%'                 THEN 'PLAN'\n        WHEN UPPER(prev_pi) LIKE '%BC'              THEN 'BC_CARRY'\n        WHEN UPPER(prev_pi) LIKE '%BO'\n          OR UPPER(pi_no)   LIKE '%BO'\n          OR UPPER(pi_no)   LIKE '%BO-%'            THEN 'BACKORDER'\n        ELSE 'NEW'\n    END AS line_type,\n\n    -- 3-1) 백카톤 줄을 다시 둘로 나눔 (사용자 확인 완료)\n    --    BC_REUSE      : 입고일 <= 발주일  → 창고에 있던 백카톤을 이번 선적에 배정 (재사용)\n    --    BC_REPURCHASE : 입고일 >  발주일  → 지난 선적에 못 실은 물건을 새로 구매\n    CASE\n        WHEN UPPER(prev_pi) LIKE '%BC' AND pi_no NOT LIKE '계획발주%' THEN\n            CASE\n                WHEN rcv_date IS NULL      THEN 'BC_OPEN'        -- 아직 미입고\n                WHEN rcv_date <= po_date   THEN 'BC_REUSE'\n                ELSE 'BC_REPURCHASE'\n            END\n    END AS bc_kind,\n\n    COALESCE(order_qty, po_qty)        AS order_qty,\n    po_qty,\n    po_price,\n    rcv_qty,\n    rcv_amount,\n    COALESCE(po_qty, 0) * COALESCE(po_price, 0) AS po_amount,\n    po_date,\n    rcv_date,\n\n    -- 4) 리드타임: 발주일 → 입고일 (일)\n    --    입고일이 발주일보다 앞서는 줄은 '이미 있던 재고를 배정'한 경우라\n    --    공급업체 납기 계산에서 제외한다.\n    CASE\n        WHEN rcv_date IS NOT NULL AND rcv_date >= po_date\n            THEN CAST(JULIANDAY(rcv_date) - JULIANDAY(po_date) AS INTEGER)\n    END AS lead_days,\n\n    CASE WHEN rcv_date IS NULL THEN 1 ELSE 0 END AS is_open   -- 미입고\nFROM raw_order_lines\nWHERE part_no IS NOT NULL;\n\n\n-- ---------------------------------------------------------\n-- 5) 재고: 같은 매칭 키 기준으로 정리 + 재고금액\n-- ---------------------------------------------------------\nDROP VIEW IF EXISTS inventory;\nCREATE VIEW inventory AS\nSELECT\n    part_no,\n    LTRIM(UPPER(REPLACE(REPLACE(TRIM(part_no), '-', ''), ' ', '')), '0') AS part_key,\n    description,\n    brand,\n    stock_qty,\n    allocated_qty,\n    free_qty,\n    stock_price,\n    stock_qty * stock_price AS stock_value,   -- 재고금액\n    free_qty  * stock_price AS free_value     -- 오더에 안 묶인 재고금액\nFROM raw_inventory\nWHERE stock_qty > 0;\n";
const BC_SQL = "-- =========================================================\n-- 03_bc_causes.sql\n-- 2-① 백카톤은 왜 생겼을까?\n--\n-- 백카톤 줄(BC_CARRY)의 이전PI 에서 'BC'를 떼면 \"원래 실렸어야 할 선적 P/I\"가 된다.\n-- 그 P/I의 실제 선적일(배가 떠난 날)과 이 줄의 발주일·입고일을 비교해서 원인을 나눈다.\n--\n--   A. 입고 지연      : 발주는 선적 전에 했는데, 입고가 선적보다 늦음\n--   B. 발주 지연      : 선적이 끝난 뒤에 발주함 (오더 추가·수량 변경 등)\n--   C. 입고됐는데 누락 : 선적 전에 이미 입고됐는데 선적에 안 실림 (창고 작업·마감 문제 의심)\n--   D. 백카톤 재사용   : 창고에 있던 백카톤을 다음 선적에 배정한 줄 (원인 분석 대상 아님)\n--   E. 연도 BC        : 이전PI 가 '바이어-2024BC' 형태 = 그 바이어의 2024년 백카톤 묶음\n--                       → 원래 어느 선적에서 넘어왔는지 기록이 없어 A~C 판단 불가\n--   F. 선적 기록 없음  : 원래 선적 P/I는 있지만 실적 파일 기간 밖 (예: 2023년 선적)\n-- =========================================================\n\nDROP VIEW IF EXISTS bc_lines;\nCREATE VIEW bc_lines AS\nSELECT\n    o.*,\n    SUBSTR(o.prev_pi, 1, LENGTH(o.prev_pi) - 2) AS missed_pi,      -- 원래 실렸어야 할 P/I\n    s.ship_date                                  AS missed_ship_date,\n    CASE\n        WHEN o.bc_kind = 'BC_REUSE'                      THEN 'D. 백카톤 재사용'\n        WHEN SUBSTR(o.prev_pi, 1, LENGTH(o.prev_pi) - 2) GLOB '*-20[0-9][0-9]'\n                                                         THEN 'E. 연도 BC (원래 선적 불명)'\n        WHEN s.ship_date IS NULL                         THEN 'F. 선적 기록 없음'\n        WHEN o.po_date >  s.ship_date                    THEN 'B. 발주 지연'\n        WHEN o.rcv_date > s.ship_date                    THEN 'A. 입고 지연'\n        WHEN o.rcv_date <= s.ship_date                   THEN 'C. 입고됐는데 누락'\n        ELSE '미입고'\n    END AS bc_cause,\n    -- 입고가 선적보다 며칠 늦었는지 (A 유형)\n    CASE WHEN o.rcv_date > s.ship_date\n         THEN CAST(JULIANDAY(o.rcv_date) - JULIANDAY(s.ship_date) AS INTEGER) END AS days_late\nFROM order_lines o\nLEFT JOIN raw_shipments s\n       ON s.pi_no = SUBSTR(o.prev_pi, 1, LENGTH(o.prev_pi) - 2)\nWHERE o.line_type = 'BC_CARRY'\n  AND o.extract_type = '발주';\n\n\n";
const TIMING_SQL = "-- =========================================================\n-- 04_order_timing.sql\n-- 3-① \"늦어도 이날까지 발주\" 기준\n--\n--   거래처별 리드타임(발주 → 입고)의 80% 지점(P80)을 구한다.\n--   = \"이 거래처 물건은 10번 중 8번은 이 일수 안에 들어온다\"\n--\n--   늦어도 발주해야 하는 날 = 선적일 − P80 리드타임\n--   이 날짜보다 늦게 발주했으면 '백카톤 위험 발주'\n-- =========================================================\n\n-- ---------------------------------------------------------\n-- 1) 거래처별 P80 리드타임\n--    · 회사 자체 재고에서 배정한 줄(리드타임 0일, 거래처명에 '재고')은 제외\n--    · 입고 20줄 미만 거래처는 전체 P80을 대신 사용\n-- ---------------------------------------------------------\nDROP VIEW IF EXISTS supplier_lead;\nCREATE VIEW supplier_lead AS\nWITH base AS (\n    SELECT supplier, lead_days\n    FROM order_lines\n    WHERE extract_type = '입고' AND line_type = 'NEW'\n      AND lead_days IS NOT NULL\n      AND supplier NOT LIKE '%재고%'\n),\nranked AS (\n    SELECT supplier, lead_days,\n           ROW_NUMBER() OVER (PARTITION BY supplier ORDER BY lead_days) AS rn,\n           COUNT(*)     OVER (PARTITION BY supplier)                    AS n\n    FROM base\n),\nper_supplier AS (\n    SELECT supplier, MAX(n) AS n,\n           ROUND(AVG(lead_days), 1) AS avg_lead,\n           MIN(CASE WHEN rn >= 0.8 * n THEN lead_days END) AS p80_lead\n    FROM ranked\n    GROUP BY supplier\n),\noverall AS (\n    SELECT MIN(lead_days) AS p80_all FROM (\n        SELECT lead_days,\n               ROW_NUMBER() OVER (ORDER BY lead_days) AS rn,\n               COUNT(*) OVER () AS n\n        FROM base)\n    WHERE rn >= 0.8 * n\n)\nSELECT p.supplier, p.n, p.avg_lead,\n       CASE WHEN p.n >= 20 THEN p.p80_lead ELSE o.p80_all END AS p80_lead,\n       CASE WHEN p.n >= 20 THEN '거래처 기준' ELSE '전체 기준(표본 부족)' END AS basis\nFROM per_supplier p CROSS JOIN overall o;\n\n\n-- ---------------------------------------------------------\n-- 2) 검증용 데이터: 선적일을 아는 신규 발주 줄 + 그 결과\n--    · 제때 실린 줄      : 자기 선적 P/I 에 그대로 남은 신규 발주\n--    · 늦어서 빠진 줄    : 백카톤 A(입고 지연)·C(입고됐는데 누락)\n-- ---------------------------------------------------------\nDROP VIEW IF EXISTS order_timing;\nCREATE VIEW order_timing AS\nWITH lines AS (\n    SELECT o.supplier, o.part_key, o.pi_no AS ship_pi, s.ship_date, o.po_date, o.po_amount,\n           0 AS became_bc\n    FROM order_lines o\n    JOIN raw_shipments s ON s.pi_no = o.pi_no\n    WHERE o.extract_type = '발주' AND o.line_type = 'NEW'\n    UNION ALL\n    SELECT supplier, part_key, missed_pi, missed_ship_date, po_date, po_amount, 1\n    FROM bc_lines\n    WHERE bc_cause IN ('A. 입고 지연', 'C. 입고됐는데 누락')\n)\nSELECT l.*,\n       sl.p80_lead,\n       DATE(l.ship_date, '-' || sl.p80_lead || ' days') AS order_by_date,   -- 늦어도 발주해야 하는 날\n       CASE WHEN l.po_date > DATE(l.ship_date, '-' || sl.p80_lead || ' days')\n            THEN 1 ELSE 0 END AS ordered_late                               -- 기준보다 늦게 발주\nFROM lines l\nJOIN supplier_lead sl ON sl.supplier = l.supplier;\n\n\n";
const REC_SQL = "-- =========================================================\n-- 05_recommend.sql\n-- 3-② 권장 발주 수량 + 발주 기한 + 위험도\n--\n--   새 오더가 들어오면 품목마다\n--     1) 창고에 쓸 수 있는 재고(잔여)가 있는지 먼저 보고\n--     2) 모자라는 만큼만 발주를 권하고\n--     3) 거래처 P80 리드타임으로 \"늦어도 이날까지 발주\"를 알려 준다.\n--\n--   권장 발주량   = MAX(오더 수량 − 잔여 재고, 0)\n--   재고에서 쓸 양 = MIN(오더 수량, 잔여 재고)\n--   발주 기한      = 선적 예정일 − P80 리드타임\n--   위험도         : 오늘이 발주 기한을 넘었으면 '높음', 3일 안이면 '중간', 그 밖은 '낮음'\n--\n--   ※ 담당자가 최종 결정한다. 이 값은 참고용이다.\n-- =========================================================\n\n-- 새로 들어온(또는 들어올) 오더를 넣는 표\nDROP TABLE IF EXISTS incoming_orders;\nCREATE TABLE incoming_orders (\n    pi_no      TEXT,\n    part_no    TEXT,\n    order_qty  INTEGER,\n    ship_date  TEXT,     -- 바이어·영업이 정한 선적 예정일\n    today      TEXT      -- 검토하는 날 (보통 오늘)\n);\n\nDROP VIEW IF EXISTS reorder_recommendation;\nCREATE VIEW reorder_recommendation AS\nWITH io AS (\n    SELECT *,\n           LTRIM(UPPER(REPLACE(REPLACE(TRIM(part_no), '-', ''), ' ', '')), '0') AS part_key\n    FROM incoming_orders\n),\nstock AS (                       -- 품목별 잔여 재고 (같은 매칭 키끼리 합침)\n    SELECT part_key, SUM(free_qty) AS free_qty\n    FROM inventory\n    GROUP BY part_key\n),\nlast_supplier AS (               -- 품목별로 가장 최근에 발주한 거래처\n    SELECT part_key, supplier FROM (\n        SELECT part_key, supplier,\n               ROW_NUMBER() OVER (PARTITION BY part_key ORDER BY po_date DESC) AS rn\n        FROM order_lines\n        WHERE line_type IN ('NEW', 'PLAN') AND supplier NOT LIKE '%재고%')\n    WHERE rn = 1\n)\nSELECT io.pi_no,\n       io.part_no,\n       io.order_qty,\n       COALESCE(st.free_qty, 0)                                        AS free_stock,\n       MIN(io.order_qty, COALESCE(st.free_qty, 0))                     AS use_from_stock,\n       MAX(io.order_qty - COALESCE(st.free_qty, 0), 0)                 AS recommended_po_qty,\n       ls.supplier,\n       sl.p80_lead,\n       DATE(io.ship_date, '-' || sl.p80_lead || ' days')               AS order_by_date,\n       CASE\n           WHEN io.order_qty <= COALESCE(st.free_qty, 0)               THEN '재고로 충당'\n           WHEN sl.p80_lead IS NULL                                    THEN '확인 필요'\n           WHEN io.today > DATE(io.ship_date, '-' || sl.p80_lead || ' days')  THEN '높음'\n           WHEN io.today > DATE(io.ship_date, '-' || (sl.p80_lead + 3) || ' days') THEN '중간'\n           ELSE '낮음'\n       END                                                             AS risk\nFROM io\nLEFT JOIN stock st          ON st.part_key = io.part_key\nLEFT JOIN last_supplier ls  ON ls.part_key = io.part_key\nLEFT JOIN supplier_lead sl  ON sl.supplier = ls.supplier;\n\n\n";

const LESSONS = [
  { group: "1단계 · 데이터 준비", key: "1-①", title: "데이터는 3종류",
    body: `
      <h2>1-① 우리가 다루는 데이터는 3종류</h2>

  { group: "1단계 · 데이터 준비", key: "1-②", title: "품번 매칭 키",
    body: `
      <h2>1-② 품번이 왜 안 맞을까?</h2>

const $ = (id) => document.getElementById(id);
let db = null, current = 0;

function renderNav(){
  const nav = $("nav"); nav.innerHTML = ""; let lastGroup = null;
  LESSONS.forEach((l, i) => {
    if (l.group !== lastGroup){ const g = document.createElement("div"); g.className = "step-group"; g.textContent = l.group; nav.appendChild(g); lastGroup = l.group; }
    const b = document.createElement("button"); b.type = "button";
    b.innerHTML = `<span class="k">${l.key}</span><span>${l.title}</span>`;
    b.setAttribute("aria-current", i === current ? "true" : "false");
    b.onclick = () => show(i); nav.appendChild(b);
  });
}
function show(i){
  current = i; renderNav();
  $("lesson").innerHTML = LESSONS[i].body;
  $("sql").value = LESSONS[i].sql;
  $("out").innerHTML = ""; $("meta").className = "meta"; $("meta").textContent = "실행 결과가 여기에 나와요.";
  try { localStorage.setItem("sql-step", String(i)); } catch(e) {}
  if (db) run();
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function run(){
  if (!db) return;
  const sql = $("sql").value; const t0 = performance.now();
  try {
    const res = db.exec(sql); const ms = (performance.now() - t0).toFixed(0);
    if (!res.length){ $("meta").className = "meta"; $("meta").textContent = `실행 완료 · 돌려줄 결과가 없는 쿼리예요 (${ms}ms)`; $("out").innerHTML = ""; return; }
    const r = res[res.length - 1]; const shown = r.values.slice(0, 500);
    let h = "<table><thead><tr>" + r.columns.map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead><tbody>";
    for (const row of shown){
      h += "<tr>" + row.map(v => v === null ? `<td class="null">NULL</td>` :
        (typeof v === "number" ? `<td class="num">${v.toLocaleString("ko-KR")}</td>` : `<td>${esc(v)}</td>`)).join("") + "</tr>";
    }
    $("out").innerHTML = h + "</tbody></table>";
    $("meta").className = "meta";
    $("meta").textContent = `${r.values.length.toLocaleString()}줄${r.values.length > 500 ? " (앞 500줄만 표시)" : ""} · ${ms}ms`;
  } catch(e){
    $("meta").className = "meta err"; $("meta").textContent = "오류: " + e.message + " · 철자, 쉼표, 따옴표를 확인해 보세요."; $("out").innerHTML = "";
  }
}

$("run").onclick = run;
$("reset").onclick = () => { $("sql").value = LESSONS[current].sql; run(); };
$("sql").addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); run(); } });

try { const s = parseInt(localStorage.getItem("sql-step") || "0", 10); if (s >= 0 && s < LESSONS.length) current = s; } catch(e) {}
show(current);

initSqlJs().then(SQL => {
  db = new SQL.Database();
  db.exec(SCHEMA_SQL);
  for (const t of DATA){
    const stmt = db.prepare(`INSERT INTO ${t.t} (${t.cols.join(",")}) VALUES (${t.cols.map(() => "?").join(",")})`);
    db.exec("BEGIN"); for (const r of t.rows) stmt.run(r); db.exec("COMMIT"); stmt.free();
  }
  db.exec(`CREATE TABLE part_examples(part_no TEXT);
    INSERT INTO part_examples VALUES ('31200-04500'),('3120004500'),('0K820-14-302'),('0K820-14302'),('0847215'),('847215');`);
  db.exec(CLEAN_SQL);
  db.exec(BC_SQL);
  db.exec(TIMING_SQL);
  db.exec(REC_SQL);
  $("status").textContent = "준비 완료"; $("status").className = "status ok";
  $("run").disabled = false; run();
}).catch(e => { $("status").textContent = "SQL 엔진을 불러오지 못했어요: " + e.message; });
</script>
